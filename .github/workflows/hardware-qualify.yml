name: Hardware qualify (self-hosted)

# Runs only on version tags. The owner's Windows runner hosts CI, release and
# hardware jobs; the historical 01:00-06:00 Asia/Dubai night window applies to
# night-only queuing, not to CI or release. The clean-account lifecycle now lives in
# release.yml as a dependent job that consumes freshly built candidates
# (audit GH-03): this workflow owns the host attestation only.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to qualify (e.g. v0.6.0)"
        required: true
      runtime_install_key:
        description: "Approved runtime install key for the opt-in probe (blank skips it; e.g. cpu, cuda12)"
        required: false
      adapter_id:
        description: "Adapter id for the opt-in probe (blank auto-selects by vendor)"
        required: false

permissions:
  contents: read

jobs:
  hardware-qualify:
    name: Zen5 + Blackwell host proof
    runs-on: [self-hosted, Windows, X64, zen5, blackwell, localmotive-hw]
    timeout-minutes: 180
    steps:
      - name: Resolve tag
        id: meta
        shell: pwsh
        env:
          RAW_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          $raw = $env:RAW_TAG
          if ($raw -notmatch '^v\d+\.\d+\.\d+$') {
            throw "Tag must match vMAJOR.MINOR.PATCH (got: $raw)"
          }
          $version = $raw.Substring(1)
          "tag=$raw" >> $env:GITHUB_OUTPUT
          "version=$version" >> $env:GITHUB_OUTPUT
          Write-Host "Qualifying $raw"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # github.sha is the tagged commit for tag pushes: pin it instead of
          # the movable tag ref (audit GH-02/GH-10).
          ref: ${{ github.sha }}

      - name: Record host hardware
        id: hw
        shell: pwsh
        run: |
          $cpu = (Get-CimInstance Win32_Processor | Select-Object -First 1 -ExpandProperty Name)
          $gpu = (Get-CimInstance Win32_VideoController | ForEach-Object Name) -join '; '
          "cpu=$cpu" >> $env:GITHUB_OUTPUT
          "gpu=$gpu" >> $env:GITHUB_OUTPUT
          Write-Host "CPU: $cpu"
          Write-Host "GPU: $gpu"
          if ($cpu -notmatch '9950X3D|Ryzen 9 9950') {
            Write-Warning "CPU name did not match expected 9950X3D; attestation will still record the actual name."
          }
          if ($gpu -notmatch '5090') {
            Write-Warning "GPU name did not match expected RTX 5090; attestation will still record the actual name."
          }

      - name: Derive and write the host attestation
        shell: pwsh
        env:
          TAG: ${{ steps.meta.outputs.tag }}
          VERSION: ${{ steps.meta.outputs.version }}
          CPU: ${{ steps.hw.outputs.cpu }}
          GPU: ${{ steps.hw.outputs.gpu }}
          SOURCE_REVISION: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # Every status is derived from the DETECTED hardware (audit GH-10):
          # MATCH, NO_MATCH and UNKNOWN are explicit, and a definite mismatch
          # fails this intended host-proof job instead of recording a match.
          $os = [System.Environment]::OSVersion.VersionString
          $driver = (Get-CimInstance Win32_VideoController | Select-Object -First 1 -ExpandProperty DriverVersion)
          $dir = Join-Path "release-evidence" $env:VERSION "attestations"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          node scripts/qualification/build_host_attestation.mjs --out (Join-Path $dir "host-zen5-blackwell.json") --cpu "$env:CPU" --gpu "$env:GPU" --os "$os" --driver "$driver" --version "$env:VERSION" --tag "$env:TAG" --source-revision "$env:SOURCE_REVISION" --run-url "$env:RUN_URL" --run-id "$env:RUN_ID"
          if ($LASTEXITCODE -ne 0) { throw "Host attestation verdict is NO_MATCH: the intended host-proof job fails (audit GH-10 I2)." }"

      - name: Job summary
        shell: pwsh
        env:
          TAG: ${{ steps.meta.outputs.tag }}
          CPU: ${{ steps.hw.outputs.cpu }}
          GPU: ${{ steps.hw.outputs.gpu }}
        run: |
          @"
          ## Hardware qualify

          - Tag: ``$($env:TAG)``
          - CPU: $($env:CPU)
          - GPU: $($env:GPU)
          - Runner: self-hosted `DESKTOP-HPTF57N-zen5-blackwell`; the historical night-only window (01:00-06:00 Asia/Dubai) no longer gates CI or release jobs
          - Main Release build/publish stays on GitHub-hosted windows-latest
          - This job records host match for Zen 5 + Blackwell; full packaged L4 PASS still needs the packaged verifier once artifacts exist
          "@ | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8

      - name: Upload attestation artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hardware-attestation-${{ steps.meta.outputs.version }}
          path: release-evidence/${{ steps.meta.outputs.version }}/attestations/
          if-no-files-found: error

  # Explicit qualification job for the ignored approved-runtime/hardware probe
  # (audit S-26 I3). It runs ONLY when a runtime install key is supplied,
  # because the probe downloads the approved runtime, installs the pinned
  # health model and executes real inference on this host. The probe asserts a
  # passing health report; its JSON result is kept as an artifact, and a
  # skipped run must never be counted as a pass.
  runtime-probe:
    name: Approved-runtime hardware probe (opt-in)
    needs: hardware-qualify
    if: ${{ inputs.runtime_install_key != '' }}
    runs-on: [self-hosted, Windows, X64, zen5, blackwell, localmotive-hw]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable reviewed 2026-09-05
      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2 peeled commit
        with:
          workspaces: src-tauri
      - name: Run the approved-runtime hardware probe
        shell: pwsh
        working-directory: src-tauri
        env:
          LOCALMOTIVE_INSTALL_KEY: ${{ inputs.runtime_install_key }}
          LOCALMOTIVE_ADAPTER_ID: ${{ inputs.adapter_id }}
        run: |
          cargo test --locked --lib -- --ignored --nocapture qualify_managed_runtime_on_current_host 2>&1 |
            Tee-Object -FilePath ..\release-evidence\runtime-probe-${{ github.sha }}.log
          if ($LASTEXITCODE -ne 0) { throw "The approved-runtime hardware probe failed" }
      - name: Upload probe evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: runtime-probe-${{ github.sha }}
          path: release-evidence/runtime-probe-${{ github.sha }}.log
          if-no-files-found: error
