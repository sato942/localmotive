name: Release verify

# Tag-driven VERIFICATION ONLY (R16 release behavior): pushing a version tag
# builds the Windows artifacts, runs every qualification gate, assembles the
# qualified candidate bundle, and stops. It never publishes. Publication is a
# separate, explicitly authorized act: `.github/workflows/release-promote.yml`
# consumes the exact qualified bundle this workflow uploads, validates source,
# artifact, inventory and evidence identity again, and only then promotes the
# bytes. See docs/RELEASE-REVIEW-0.6.md for the owner handoff.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build and release (e.g. v0.2.4)"
        required: true
      publish:
        description: "Publish the verified candidate after all gates pass"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: localmotive-release
  cancel-in-progress: true

jobs:
  # Resolve the requested tag to ONE immutable commit once, and verify its
  # main ancestry here; every later job checks out exactly this revision, so
  # a moved or re-created tag can never mix sources across jobs
  # (audit GH-02 I1).
  resolve:
    runs-on: [self-hosted, Windows, X64, zen5, blackwell, localmotive-hw]
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
      tag: ${{ steps.resolve.outputs.tag }}
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - name: Pin LF line endings before checkout
        shell: bash
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20

      - name: Resolve the release tag to one immutable revision
        id: resolve
        shell: bash
        env:
          RAW_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          raw="$RAW_TAG"
          # Any vMAJOR.MINOR.PATCH tag is buildable; the safety comes from the
          # revision pin plus the manifest binding below, so a retargeted or
          # mismatched tag cannot publish source that identifies as another
          # version (audit S-26 I2 replaced the literal v0.5.0 pin).
          case "$raw" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "::error::Release tags must be vMAJOR.MINOR.PATCH"; exit 1 ;;
          esac
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "tag=v${raw#v}" >> "$GITHUB_OUTPUT"
          echo "version=${raw#v}" >> "$GITHUB_OUTPUT"
          node scripts/verify_versions.mjs "${raw#v}" \
            || { echo "::error::The manifests at $raw do not identify as ${raw#v}; refusing to publish mismatched source"; exit 1; }

      - name: Verify the resolved revision is on main
        shell: bash
        run: |
          git fetch origin main
          git merge-base --is-ancestor "${{ steps.resolve.outputs.sha }}" origin/main \
            || { echo "::error::Release tags must point to a commit on main"; exit 1; }

  rust-audit:
    needs: resolve
    runs-on: [self-hosted, Windows, X64, zen5, blackwell, localmotive-hw]
    permissions:
      contents: read
      checks: write
    steps:
      # The self-hosted runner image defaults core.autocrlf=true, which
      # marks LF-tracked text files modified after checkout and trips the
      # packaged clean-source probe. v5.1.0 has no git-config input, so pin
      # LF explicitly before checkout. Scoped to the runner, not the repo.
      - name: Pin LF line endings before checkout
        shell: bash
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.sha }}
      # The self-hosted runner keeps no cargo on PATH for fresh shells, and
      # audit-check shells out to cargo. Install the pinned toolchain first.
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable reviewed 2026-09-05
        with:
          components: clippy, rustfmt
      - name: Rust dependency advisory audit
        uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          working-directory: src-tauri

  quality:
    needs: [resolve, rust-audit]
    runs-on: [self-hosted, Windows, X64, zen5, blackwell, localmotive-hw]
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
    steps:
      # The self-hosted runner image defaults core.autocrlf=true; pin LF
      # before checkout (v5.1.0 has no git-config input).
      - name: Pin LF line endings before checkout
        shell: bash
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          fetch-depth: 0

      - name: Confirm the checked-out revision is the resolved release source
        id: version
        shell: bash
        env:
          RAW_TAG: ${{ github.event.inputs.tag || github.ref_name }}
          RESOLVED_SHA: ${{ needs.resolve.outputs.sha }}
        run: |
          raw="$RAW_TAG"
          case "$raw" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "::error::Release tags must be vMAJOR.MINOR.PATCH"; exit 1 ;;
          esac
          test "$(git rev-parse HEAD)" = "$RESOLVED_SHA" \
            || { echo "::error::quality checkout does not match the resolved release revision"; exit 1; }
          version="${raw#v}"
          echo "tag=v${version}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable reviewed 2026-09-05
        with:
          components: clippy, rustfmt

      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2 peeled commit
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Verify manifest and lockfile versions
        run: node scripts/verify_versions.mjs ${{ needs.resolve.outputs.version }}

      - name: Verify immutable workflow action references
        run: node scripts/verify_workflow_pins.mjs

      - name: Verify fail-fast workflow gates
        run: node scripts/verify_workflow_gates.mjs

      # Fail fast (audit S-26 I2): this also runs inside `npm run check`
      # below; the explicit first pass surfaces gate failures before the
      # packaging chain (pinned by a release-gates.test.mjs check).
      - name: Test deterministic release gates (fail-fast; repeated by npm run check)
        run: node --test scripts/tests/release-gates.test.mjs

      - name: Frontend checks
        run: npm run check

      - name: Frontend dependency audit
        run: npm audit --audit-level=moderate

      - name: Rust formatting
        working-directory: src-tauri
        run: cargo fmt --check

      - name: Rust linting
        working-directory: src-tauri
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Rust tests
        working-directory: src-tauri
        run: cargo test --locked

      - name: Rust documentation tests
        working-directory: src-tauri
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo test --locked --doc

  package:
    needs: [resolve, rust-audit, quality]
    runs-on: [self-hosted, Windows, X64, zen5, blackwell, localmotive-hw]
    steps:
      # The self-hosted runner image defaults core.autocrlf=true; pin LF
      # before checkout (v5.1.0 has no git-config input).
      - name: Pin LF line endings before checkout
        shell: bash
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.sha }}

      - name: Record the resolved source revision
        shell: bash
        env:
          RESOLVED_SHA: ${{ needs.resolve.outputs.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$RESOLVED_SHA" \
            || { echo "::error::package checkout does not match the resolved release revision"; exit 1; }
          echo "LOCALMOTIVE_SOURCE_REVISION=$RESOLVED_SHA" >> "$GITHUB_ENV"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable reviewed 2026-09-05

      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2 peeled commit
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Generate an SBOM for the shipped frontend dependencies
        shell: bash
        run: |
          npm sbom --sbom-format cyclonedx > sbom.cdx.json
          test -s sbom.cdx.json

      - name: Upload the SBOM (audit GH-08)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-${{ needs.quality.outputs.version }}
          path: sbom.cdx.json
          retention-days: 90

      - name: Build installers and portable executable
        run: npm run tauri build

      - name: Verify the packaged executable
        shell: pwsh
        env:
          VERSION: ${{ needs.quality.outputs.version }}
          RESOLVED_SHA: ${{ needs.resolve.outputs.sha }}
        run: |
          $portable = "src-tauri/target/release/localmotive.exe"
          if (-not (Test-Path $portable)) { throw "Portable executable was not built" }
          New-Item -ItemType Directory -Force -Path "artifacts" | Out-Null
          $isolatedRoot = Join-Path $env:RUNNER_TEMP "localmotive-verify-appdata"
          $profile = Join-Path $env:RUNNER_TEMP "localmotive-verify-webview2"
          # Unique CDP port per run: a fixed port plus parent-only
          # Stop-Process leaves an orphan WebView2 holding CDP, and the next
          # run attaches to the stale page.
          $cdpPort = 10041 + ([int]($env:GITHUB_RUN_ID % 2000))
          function Stop-VerifyLeftovers([int]$Port) {
            $pids = @()
            try {
              $conns = Get-NetTCPConnection -LocalPort $Port -ErrorAction SilentlyContinue
              if ($conns) { $pids += @($conns | Select-Object -ExpandProperty OwningProcess -Unique) }
            } catch { }
            $pids += @(Get-Process -Name "localmotive","msedgewebview2" -ErrorAction SilentlyContinue |
              Where-Object { $_.Path -like "*$env:RUNNER_TEMP*" } |
              Select-Object -ExpandProperty Id)
            foreach ($procId in ($pids | Select-Object -Unique)) {
              if ($procId -and $procId -ne 0) {
                cmd /c "taskkill /F /T /PID $procId" | Out-Null
              }
            }
          }
          Stop-VerifyLeftovers -Port $cdpPort
          Stop-VerifyLeftovers -Port 10041
          Remove-Item -LiteralPath $isolatedRoot,$profile -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $isolatedRoot | Out-Null
          New-Item -ItemType Directory -Force -Path $profile | Out-Null
          $env:LOCALAPPDATA = $isolatedRoot
          $env:LOCALMOTIVE_VERIFY_ISOLATED_ROOT = $isolatedRoot
          $env:WEBVIEW2_USER_DATA_FOLDER = $profile
          $env:WEBVIEW2_ADDITIONAL_BROWSER_ARGUMENTS = "--remote-debugging-port=$cdpPort --user-data-dir=$profile"
          # Controlled signed catalog fixture for the 0.6 catalog/SQLite
          # packaged matrix (audit GH-05); verifier-owned profiles only.
          $catalogState = Join-Path $env:RUNNER_TEMP "localmotive-verify-catalog"
          Remove-Item -LiteralPath $catalogState -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $catalogState | Out-Null
          $catalogInit = (node scripts/verify_060_catalog.mjs init $catalogState "artifacts/catalog-fixture-init.json" | ConvertFrom-Json)
          if ($catalogInit.status -ne "PASS") { throw "The catalog fixture server did not initialize" }
          $env:LOCALMOTIVE_CATALOG_URL = $catalogInit.fixture_url
          $env:LOCALMOTIVE_CATALOG_PUBKEY = $catalogInit.fixture_pubkey
          # Tauri's known-folder cache ignores a redirected LOCALAPPDATA, so
          # the verifier names the catalog cache root explicitly; it must sit
          # inside the isolated profile or the candidate refuses it.
          $catalogRoot = Join-Path $isolatedRoot "catalog-cache"
          New-Item -ItemType Directory -Force -Path $catalogRoot | Out-Null
          $env:LOCALMOTIVE_CATALOG_ROOT = $catalogRoot
          function Start-Candidate([int]$Port) {
            $process = Start-Process $portable -PassThru
            $deadline = (Get-Date).AddSeconds(90)
            while ($true) {
              try {
                $tabs = Invoke-RestMethod "http://127.0.0.1:$Port/json/list"
                $ready = @($tabs | Where-Object {
                  $_.type -eq 'page' -and $_.webSocketDebuggerUrl -and
                  ($_.url -match 'tauri|localhost|localmotive|asset' -or $_.title)
                })
                if ($ready.Count -gt 0) { break }
              } catch { }
              if ((Get-Date) -gt $deadline) {
                if ($process -and -not $process.HasExited) { cmd /c "taskkill /F /T /PID $($process.Id)" | Out-Null }
                throw "Candidate WebView did not expose a page CDP target in 90s (port $Port)"
              }
              Start-Sleep -Seconds 2
            }
            return $process
          }
          function Stop-Candidate($process) {
            if ($process -and -not $process.HasExited) {
              cmd /c "taskkill /F /T /PID $($process.Id)" | Out-Null
            }
            Stop-VerifyLeftovers -Port $cdpPort
          }
          $process = Start-Candidate $cdpPort
          try {
            node scripts/verify_041.mjs $cdpPort $portable "artifacts/packaged-verification-0.4.1.json"
            if ($LASTEXITCODE -ne 0) { throw "verify_041 failed with code $LASTEXITCODE" }
            $record = Get-Content "artifacts/packaged-verification-0.4.1.json" -Raw | ConvertFrom-Json
            if ($record.overall_status -ne "PASS") { throw "Packaged verification record is not PASS" }

            # Catalog/SQLite matrix (audit GH-05): launch #1 first fill,
            # controlled signature and cooldown, then corruption and restart.
            node scripts/verify_060_catalog.mjs first-fill $cdpPort $catalogState "artifacts/catalog-matrix-first-fill.json"
            if ($LASTEXITCODE -ne 0) { throw "Catalog first-fill phase failed with code $LASTEXITCODE" }
          } finally {
            Stop-Candidate $process
          }
          node scripts/verify_060_catalog.mjs prep $catalogState
          if ($LASTEXITCODE -ne 0) { throw "Catalog corruption phase failed with code $LASTEXITCODE" }
          $process = $null
          try {
            $process = Start-Candidate $cdpPort
            node scripts/verify_060_catalog.mjs restart $cdpPort $catalogState "artifacts/catalog-matrix-restart.json"
            if ($LASTEXITCODE -ne 0) { throw "Catalog restart phase failed with code $LASTEXITCODE" }
          } finally {
            Stop-Candidate $process
          }
          $env:LOCALMOTIVE_SOURCE_REVISION = $env:RESOLVED_SHA
          node scripts/verify_060_catalog.mjs merge $portable "artifacts/catalog-matrix-first-fill.json" "artifacts/catalog-matrix-restart.json" "artifacts/packaged-verification-catalog-$env:VERSION.json"
          if ($LASTEXITCODE -ne 0) { throw "The catalog/SQLite packaged matrix is not PASS" }
          # Also kill the fixture server explicitly: prep already did, this is
          # belt-and-braces against an early failure before prep ran.
          if ($catalogInit -and $catalogInit.fixture_url -match ':(\d+)/') {
            $fixturePid = (Get-Content (Join-Path $catalogState 'state.json') -Raw | ConvertFrom-Json).serverPid
            if ($fixturePid) { cmd /c "taskkill /F /PID $fixturePid" 2>$null | Out-Null }
          }

      - name: Stage release artifacts
        shell: bash
        env:
          VERSION: ${{ needs.quality.outputs.version }}
        run: |
          mkdir -p artifacts
          cp "src-tauri/target/release/bundle/msi/Localmotive_${VERSION}_x64_en-US.msi" "artifacts/Localmotive_${VERSION}_x64.msi"
          cp "src-tauri/target/release/bundle/nsis/Localmotive_${VERSION}_x64-setup.exe" "artifacts/Localmotive_${VERSION}_x64-setup.exe"
          cp "src-tauri/target/release/localmotive.exe" "artifacts/Localmotive_${VERSION}_x64-portable.exe"
          test -s "artifacts/Localmotive_${VERSION}_x64.msi"
          test -s "artifacts/Localmotive_${VERSION}_x64-setup.exe"
          test -s "artifacts/Localmotive_${VERSION}_x64-portable.exe"
          (cd artifacts && sha256sum Localmotive_* > "SHA256SUMS-${VERSION}.txt")
          test "$(wc -l < "artifacts/SHA256SUMS-${VERSION}.txt")" -eq 3

      - name: Verify and record the exact candidate inventory
        shell: bash
        env:
          VERSION: ${{ needs.quality.outputs.version }}
        run: node scripts/verify_candidate_inventory.mjs artifacts "$VERSION" "artifacts/candidate-inventory-${VERSION}.json"

      - name: Retain verified release candidates
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: localmotive-${{ needs.quality.outputs.version }}-verified
          path: artifacts/*
          if-no-files-found: error
          retention-days: 14

  # Clean-account lifecycle verification, rewritten per audit GH-03: it
  # consumes the candidate installers the package job just built
  # (-CandidateDir), so no job ever waits for public release assets that the
  # producer has not published. Policy updated on 2026-09-12 (fail-closed,
  # superseding GH-03 I3's original note): `publish` now needs this job, so
  # absent or failed lifecycle evidence blocks publication instead of
  # shipping with a visible-but-ignored status. The evidence binds to the
  # full source SHA recorded in the candidate inventory (never a substituted
  # HEAD) and records the harness revision separately; the summary states
  # plainly whether it ran, passed, failed or was skipped.
  clean-account-lifecycle:
    needs: [resolve, quality, package]
    runs-on: [self-hosted, Windows, X64, zen5, blackwell, localmotive-hw]
    timeout-minutes: 120
    # Explicit supported qualification matrix (audit GH-04 I4 / G-06.I2;
    # R07 follow-up review): every supported baseline runs the update path
    # AND its preservation step with the baseline's real persistence flavor
    # (v0.4.x predates the SQLite mirror, so it uses the cache-record leg).
    steps:
      - name: Pin LF line endings before checkout
        shell: bash
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.sha }}

      - name: Ensure Windows Sandbox is available
        shell: pwsh
        run: |
          $exe = Join-Path $env:WINDIR "System32\WindowsSandbox.exe"
          if (-not (Test-Path $exe)) {
            throw "Windows Sandbox is not available on this PC. Enable it (Windows Features) then re-run."
          }
          Write-Host "Found $exe"

      - name: Retrieve the verified candidate installers
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: localmotive-${{ needs.quality.outputs.version }}-verified
          path: artifacts

      - name: Run the clean-account lifecycle matrix from the candidate bytes
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          LOCALMOTIVE_SOURCE_REVISION: ${{ needs.resolve.outputs.sha }}
        run: |
          $matrix = @(
            @{ Name = "sandbox-clean-account-lifecycle-upgrade-v0.4.0";      Previous = "v0.4.0"; Flavor = "cache" },
            @{ Name = "sandbox-clean-account-lifecycle-upgrade-v0.5.0";      Previous = "v0.5.0"; Flavor = "mirror" },
            @{ Name = "sandbox-clean-account-lifecycle-preservation-v0.4.1"; Previous = "v0.4.1"; Flavor = "cache" },
            @{ Name = "sandbox-clean-account-lifecycle-preservation-v0.5.0"; Previous = "v0.5.0"; Flavor = "mirror" }
          )
          foreach ($leg in $matrix) {
            Write-Host "=== $($leg.Name): baseline $($leg.Previous), persistence $($leg.Flavor) ==="
            & ".\scripts\sandbox\host-run-lifecycle.ps1" -Tag "${{ needs.resolve.outputs.tag }}" -Version "${{ needs.quality.outputs.version }}" -PreviousTag $leg.Previous -CandidateDir "artifacts" -EvidenceName $leg.Name -PreservationFlavor $leg.Flavor
          }

      # R13 (follow-up review): a failing leg still leaves its structured
      # evidence retrievable from the run itself, not only from the checkout
      # of a machine that happened to run it.
      - name: Retain lifecycle evidence for every outcome
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: localmotive-${{ needs.quality.outputs.version }}-lifecycle-evidence
          path: |
            release-evidence/${{ needs.quality.outputs.version }}/attestations/sandbox-clean-account-lifecycle-*
          if-no-files-found: ignore
          retention-days: 90

      - name: Lifecycle evidence summary
        if: always()
        shell: pwsh
        env:
          VERSION: ${{ needs.quality.outputs.version }}
        run: |
          $legs = @(
            "sandbox-clean-account-lifecycle-upgrade-v0.4.0",
            "sandbox-clean-account-lifecycle-upgrade-v0.5.0",
            "sandbox-clean-account-lifecycle-preservation-v0.4.1",
            "sandbox-clean-account-lifecycle-preservation-v0.5.0"
          )
          $lines = @("## Clean-account lifecycle (Windows Sandbox)", "")
          $lines += "- Candidate installers: consumed from the package job through -CandidateDir (no prepublication wait)"
          $lines += "- Qualification matrix: every supported baseline above runs its update path and its preservation step with the baseline's real persistence flavor (R07/G-06.I2)."
          $lines += "- Policy: publication depends on this job; a failing leg fails the release (no pass-with-note)."
          foreach ($name in $legs) {
            $evidence = "release-evidence/$($env:VERSION)/attestations/$name.json"
            $status = if (Test-Path $evidence) { (Get-Content $evidence -Raw | ConvertFrom-Json).status } else { "MISSING" }
            $preservation = if (Test-Path $evidence) { (Get-Content $evidence -Raw | ConvertFrom-Json).preservation.status } else { "MISSING" }
            $lines += "- ``$name``: scenario **$status** (preservation: $preservation)"
          }
          $lines | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8

      - name: Upload lifecycle evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sandbox-lifecycle-${{ needs.quality.outputs.version }}
          path: release-evidence/${{ needs.quality.outputs.version }}/attestations/
          if-no-files-found: error

  # The qualified candidate bundle: one artifact that binds the frozen source,
  # the built bytes, the producer inventory, the packaged verification record,
  # the sandbox lifecycle records, the witness records and the payload identity
  # record through the committed manifest generator, then validates every one
  # of those relationships with the committed verifier. Publication consumes
  # this bundle and nothing else (release-promote.yml).
  qualification:
    needs: [resolve, quality, package, clean-account-lifecycle]
    runs-on: [self-hosted, Windows, X64, zen5, blackwell, localmotive-hw]
    steps:
      # The self-hosted runner image defaults core.autocrlf=true; pin LF
      # before checkout (v5.1.0 has no git-config input).
      - name: Pin LF line endings before checkout
        shell: bash
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.sha }}

      - name: Retrieve the verified candidate artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: localmotive-${{ needs.quality.outputs.version }}-verified
          path: artifacts

      - name: Confirm the checked-out revision is the resolved release source
        shell: bash
        env:
          RESOLVED_SHA: ${{ needs.resolve.outputs.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$RESOLVED_SHA"             || { echo "::error::qualification checkout does not match the resolved release revision"; exit 1; }
          echo "LOCALMOTIVE_SOURCE_REVISION=$RESOLVED_SHA" >> "$GITHUB_ENV"

      - name: Assemble the canonical qualification manifest
        shell: bash
        env:
          VERSION: ${{ needs.quality.outputs.version }}
          RESOLVED_SHA: ${{ needs.resolve.outputs.sha }}
        run: node scripts/build_qualification_manifest.mjs --stage artifacts --inventory "artifacts/candidate-inventory-${VERSION}.json" --attestations "release-evidence/${VERSION}/attestations" --release "$VERSION" --source "$RESOLVED_SHA" --out "release-evidence/${VERSION}/qualification-manifest-${VERSION}.json"

      - name: Validate the manifest, inventory, and every mandatory record
        shell: bash
        env:
          RESOLVED_SHA: ${{ needs.resolve.outputs.sha }}
        run: node scripts/verify_qualification_manifest.mjs --expect-source "$RESOLVED_SHA"

      - name: Validate the promotion contract without publishing
        shell: bash
        env:
          VERSION: ${{ needs.quality.outputs.version }}
          RESOLVED_SHA: ${{ needs.resolve.outputs.sha }}
        run: node scripts/verify_release_promotion.mjs --qualified . --tag "v${VERSION}" --expect-source "$RESOLVED_SHA" --report "artifacts/promotion-check-${VERSION}.json"

      - name: Retain the qualified candidate bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: localmotive-${{ needs.quality.outputs.version }}-qualified
          path: |
            artifacts/*
            release-evidence/${{ needs.quality.outputs.version }}/qualification-manifest-${{ needs.quality.outputs.version }}.json
            release-evidence/${{ needs.quality.outputs.version }}/attestations/*
          if-no-files-found: error
          retention-days: 90
