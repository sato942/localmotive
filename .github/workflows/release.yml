name: Release

# Tag-driven: pushing a version tag builds the Windows artifacts and publishes a
# release titled with that version whose body is the matching CHANGELOG section.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build and release (e.g. v0.2.4)"
        required: true
      publish:
        description: "Publish the verified candidate after all gates pass"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: localmotive-release
  cancel-in-progress: true

jobs:
  rust-audit:
    runs-on: [self-hosted, Windows, X64, zen5, blackwell, localmotive-hw]
    permissions:
      contents: read
      checks: write
    steps:
      # The self-hosted runner image defaults core.autocrlf=true, which
      # marks LF-tracked text files modified after checkout and trips the
      # packaged clean-source probe. v5.1.0 has no git-config input, so pin
      # LF explicitly before checkout. Scoped to the runner, not the repo.
      - name: Pin LF line endings before checkout
        shell: bash
        run: git config --global core.autocrlf false
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      # The self-hosted runner keeps no cargo on PATH for fresh shells, and
      # audit-check shells out to cargo. Install the pinned toolchain first.
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable reviewed 2026-09-05
        with:
          components: clippy, rustfmt
      - name: Rust dependency advisory audit
        uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          working-directory: src-tauri

  quality:
    needs: rust-audit
    runs-on: [self-hosted, Windows, X64, zen5, blackwell, localmotive-hw]
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
    steps:
      # The self-hosted runner image defaults core.autocrlf=true; pin LF
      # before checkout (v5.1.0 has no git-config input).
      - name: Pin LF line endings before checkout
        shell: bash
        run: git config --global core.autocrlf false
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Resolve version
        id: version
        shell: bash
        env:
          RAW_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          raw="$RAW_TAG"
          test "$raw" = "v0.5.0" \
            || { echo "::error::This workflow builds only v0.5.0"; exit 1; }
          version="${raw#v}"
          echo "tag=v${version}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Verify release commit is on main
        shell: bash
        run: |
          git fetch origin main
          release_commit=$(git rev-parse HEAD)
          git merge-base --is-ancestor "$release_commit" origin/main \
            || { echo "::error::Release tags must point to a commit on main"; exit 1; }

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable reviewed 2026-09-05
        with:
          components: clippy, rustfmt

      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2 peeled commit
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Verify manifest and lockfile versions
        run: node scripts/verify_versions.mjs 0.5.0

      - name: Verify immutable workflow action references
        run: node scripts/verify_workflow_pins.mjs

      - name: Verify fail-fast workflow gates
        run: node scripts/verify_workflow_gates.mjs

      - name: Test deterministic release gates
        run: node --test scripts/tests/release-gates.test.mjs

      - name: Frontend checks
        run: npm run check

      - name: Frontend dependency audit
        run: npm audit --audit-level=moderate

      - name: Rust formatting
        working-directory: src-tauri
        run: cargo fmt --check

      - name: Rust linting
        working-directory: src-tauri
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Rust tests
        working-directory: src-tauri
        run: cargo test --locked

      - name: Rust documentation tests
        working-directory: src-tauri
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo test --locked --doc

  package:
    needs: [rust-audit, quality]
    runs-on: [self-hosted, Windows, X64, zen5, blackwell, localmotive-hw]
    steps:
      # The self-hosted runner image defaults core.autocrlf=true; pin LF
      # before checkout (v5.1.0 has no git-config input).
      - name: Pin LF line endings before checkout
        shell: bash
        run: git config --global core.autocrlf false
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Resolve exact source revision
        shell: bash
        run: echo "LOCALMOTIVE_SOURCE_REVISION=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable reviewed 2026-09-05

      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2 peeled commit
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Build installers and portable executable
        run: npm run tauri build

      - name: Verify the packaged executable
        shell: pwsh
        run: |
          $portable = "src-tauri/target/release/localmotive.exe"
          if (-not (Test-Path $portable)) { throw "Portable executable was not built" }
          New-Item -ItemType Directory -Force -Path "artifacts" | Out-Null
          $isolatedRoot = Join-Path $env:RUNNER_TEMP "localmotive-verify-appdata"
          $profile = Join-Path $env:RUNNER_TEMP "localmotive-verify-webview2"
          # Unique CDP port per run: a fixed port plus parent-only
          # Stop-Process leaves an orphan WebView2 holding CDP, and the next
          # run attaches to the stale page.
          $cdpPort = 10041 + ([int]($env:GITHUB_RUN_ID % 2000))
          function Stop-VerifyLeftovers([int]$Port) {
            $pids = @()
            try {
              $conns = Get-NetTCPConnection -LocalPort $Port -ErrorAction SilentlyContinue
              if ($conns) { $pids += @($conns | Select-Object -ExpandProperty OwningProcess -Unique) }
            } catch { }
            $pids += @(Get-Process -Name "localmotive","msedgewebview2" -ErrorAction SilentlyContinue |
              Where-Object { $_.Path -like "*$env:RUNNER_TEMP*" } |
              Select-Object -ExpandProperty Id)
            foreach ($procId in ($pids | Select-Object -Unique)) {
              if ($procId -and $procId -ne 0) {
                cmd /c "taskkill /F /T /PID $procId" | Out-Null
              }
            }
          }
          Stop-VerifyLeftovers -Port $cdpPort
          Stop-VerifyLeftovers -Port 10041
          Remove-Item -LiteralPath $isolatedRoot,$profile -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $isolatedRoot | Out-Null
          New-Item -ItemType Directory -Force -Path $profile | Out-Null
          $env:LOCALAPPDATA = $isolatedRoot
          $env:LOCALMOTIVE_VERIFY_ISOLATED_ROOT = $isolatedRoot
          $env:WEBVIEW2_USER_DATA_FOLDER = $profile
          $env:WEBVIEW2_ADDITIONAL_BROWSER_ARGUMENTS = "--remote-debugging-port=$cdpPort --user-data-dir=$profile"
          $process = Start-Process $portable -PassThru
          try {
            # The WebView needs seconds to expose CDP: poll /json/list
            # for a real page target, not an empty or stale list.
            $deadline = (Get-Date).AddSeconds(90)
            while ($true) {
              try {
                $tabs = Invoke-RestMethod "http://127.0.0.1:$cdpPort/json/list"
                $ready = @($tabs | Where-Object {
                  $_.type -eq 'page' -and $_.webSocketDebuggerUrl -and
                  ($_.url -match 'tauri|localhost|localmotive|asset' -or $_.title)
                })
                if ($ready.Count -gt 0) { break }
              } catch { }
              if ((Get-Date) -gt $deadline) { throw "Candidate WebView did not expose a page CDP target in 90s (port $cdpPort)" }
              Start-Sleep -Seconds 2
            }
            node scripts/verify_041.mjs $cdpPort $portable "artifacts/packaged-verification-0.4.1.json"
            if ($LASTEXITCODE -ne 0) { throw "verify_041 failed with code $LASTEXITCODE" }
            $record = Get-Content "artifacts/packaged-verification-0.4.1.json" -Raw | ConvertFrom-Json
            if ($record.overall_status -ne "PASS") { throw "Packaged verification record is not PASS" }
          } finally {
            if ($process -and -not $process.HasExited) {
              cmd /c "taskkill /F /T /PID $($process.Id)" | Out-Null
            }
            Stop-VerifyLeftovers -Port $cdpPort
          }

      - name: Stage release artifacts
        shell: bash
        env:
          VERSION: ${{ needs.quality.outputs.version }}
        run: |
          mkdir -p artifacts
          cp "src-tauri/target/release/bundle/msi/Localmotive_${VERSION}_x64_en-US.msi" "artifacts/Localmotive_${VERSION}_x64.msi"
          cp "src-tauri/target/release/bundle/nsis/Localmotive_${VERSION}_x64-setup.exe" "artifacts/Localmotive_${VERSION}_x64-setup.exe"
          cp "src-tauri/target/release/localmotive.exe" "artifacts/Localmotive_${VERSION}_x64-portable.exe"
          test -s "artifacts/Localmotive_${VERSION}_x64.msi"
          test -s "artifacts/Localmotive_${VERSION}_x64-setup.exe"
          test -s "artifacts/Localmotive_${VERSION}_x64-portable.exe"
          (cd artifacts && sha256sum Localmotive_* > "SHA256SUMS-${VERSION}.txt")
          test "$(wc -l < "artifacts/SHA256SUMS-${VERSION}.txt")" -eq 3

      - name: Verify and record the exact candidate inventory
        shell: bash
        env:
          VERSION: ${{ needs.quality.outputs.version }}
        run: node scripts/verify_candidate_inventory.mjs artifacts "$VERSION" "artifacts/candidate-inventory-${VERSION}.json"

      - name: Retain verified release candidates
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: localmotive-${{ needs.quality.outputs.version }}-verified
          path: artifacts/*
          if-no-files-found: error
          retention-days: 14

  publish:
    # Preferred ship path: pushing the version tag publishes after package
    # PASS in the same run, so no second parallel package ever shares the
    # runner CDP. Dispatch + publish=true stays for republish only.
    if: >-
      needs.quality.outputs.tag == 'v0.5.0' &&
      (github.ref == 'refs/tags/v0.5.0' ||
        (github.event_name == 'workflow_dispatch' && inputs.publish))
    needs: [rust-audit, quality, package]
    runs-on: [self-hosted, Windows, X64, zen5, blackwell, localmotive-hw]
    permissions:
      contents: write
    steps:
      # The self-hosted runner image defaults core.autocrlf=true; pin LF
      # before checkout (v5.1.0 has no git-config input).
      - name: Pin LF line endings before checkout
        shell: bash
        run: git config --global core.autocrlf false
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Retrieve verified release candidates
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: localmotive-${{ needs.quality.outputs.version }}-verified
          path: artifacts

      - name: Verify checksums and inventory for the honestly unsigned full release
        shell: bash
        env:
          VERSION: ${{ needs.quality.outputs.version }}
        run: |
          node scripts/verify_candidate_inventory.mjs artifacts "$VERSION" "artifacts/candidate-inventory-${VERSION}.json"
          (cd artifacts && sha256sum -c "SHA256SUMS-${VERSION}.txt")
          node -e "const v=JSON.parse(require('fs').readFileSync('artifacts/candidate-inventory-${VERSION}.json','utf8')); if(v.release!=='${VERSION}') throw new Error('inventory release mismatch')"
          echo "Honestly unsigned full release: Authenticode is DEFERRED_BY_OWNER; no signature is claimed. SmartScreen may warn."

      - name: Extract this version's changelog section
        shell: bash
        env:
          VERSION: ${{ needs.quality.outputs.version }}
        run: |
          section=$(awk -v v="## ${VERSION}" '$0 == v {found=1; next} found && /^## / {exit} found {print}' CHANGELOG.md)
          test -n "$(printf '%s' "$section" | tr -d '[:space:]')"
          {
            echo "## Localmotive ${VERSION}"
            echo
            printf '%s\n' "$section"
            echo
            echo "### Downloads"
            echo
            echo "| File | Use |"
            echo "|---|---|"
            echo "| \`Localmotive_${VERSION}_x64-setup.exe\` | Recommended installer (NSIS) |"
            echo "| \`Localmotive_${VERSION}_x64.msi\` | MSI installer for managed deployment |"
            echo "| \`Localmotive_${VERSION}_x64-portable.exe\` | Portable executable, no installation |"
            echo "| \`SHA256SUMS-${VERSION}.txt\` | Executable and installer SHA-256 inventory |"
            echo "| \`packaged-verification-0.4.1.json\` | Packaged behavior evidence |"
            echo "| \`candidate-inventory-${VERSION}.json\` | Candidate size and digest evidence |"
            echo
            echo "Target scope: Windows 10 and Windows 11 x64. See the qualification limitations above."
            echo ""
            echo "This full release is honestly unsigned: Authenticode is DEFERRED_BY_OWNER, no signature is claimed, and Windows SmartScreen may warn. Verify the published SHA-256 checksums before use."
          } > release-notes.md

      - name: Publish the explicitly approved honestly unsigned full release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ needs.quality.outputs.tag }}
          name: Localmotive ${{ needs.quality.outputs.version }} (unsigned)
          prerelease: false
          body_path: release-notes.md
          files: |
            artifacts/Localmotive_${{ needs.quality.outputs.version }}_x64-setup.exe
            artifacts/Localmotive_${{ needs.quality.outputs.version }}_x64-portable.exe
            artifacts/Localmotive_${{ needs.quality.outputs.version }}_x64.msi
            artifacts/SHA256SUMS-${{ needs.quality.outputs.version }}.txt
            artifacts/packaged-verification-0.4.1.json
            artifacts/candidate-inventory-${{ needs.quality.outputs.version }}.json
          fail_on_unmatched_files: true

      - name: Read back and verify the public release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.quality.outputs.tag }}
          VERSION: ${{ needs.quality.outputs.version }}
        run: |
          rm -rf public-readback
          mkdir public-readback
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" \
            --json tagName,name,isDraft,isPrerelease,assets,body \
            > public-readback/release.json
          node -e "const r=JSON.parse(require('fs').readFileSync('public-readback/release.json','utf8')); const assert=require('assert'); assert.equal(r.tagName,process.env.TAG); assert.equal(r.name,'Localmotive '+process.env.VERSION+' (unsigned)'); assert.equal(r.isDraft,false); assert.equal(r.isPrerelease,false); assert.equal(r.assets.length,6);"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
            --dir public-readback --clobber
          for name in \
            "Localmotive_${VERSION}_x64-setup.exe" \
            "Localmotive_${VERSION}_x64-portable.exe" \
            "Localmotive_${VERSION}_x64.msi" \
            "SHA256SUMS-${VERSION}.txt" \
            "packaged-verification-0.4.1.json" \
            "candidate-inventory-${VERSION}.json"; do
            test -s "public-readback/$name"
          done
          cmp "artifacts/SHA256SUMS-${VERSION}.txt" "public-readback/SHA256SUMS-${VERSION}.txt"
          (cd public-readback && sha256sum -c "SHA256SUMS-${VERSION}.txt")

      - name: Retain public release read-back evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: localmotive-${{ needs.quality.outputs.version }}-public-readback
          path: public-readback/*
          if-no-files-found: error
          retention-days: 90
