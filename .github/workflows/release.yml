name: Release verify

# Build and qualify one source revision. Never publish from this workflow.
# release-promote.yml validates and publishes the retained bytes separately.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Version tag to verify"
        required: true

permissions:
  contents: read

concurrency:
  group: localmotive-release
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: [self-hosted, Windows, X64, localmotive-release]
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
      tag: ${{ steps.resolve.outputs.tag }}
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - name: Pin LF line endings before checkout
        shell: bash
        run: git config --global core.autocrlf false
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20

      - name: Require main ancestry before running repository code
        shell: bash
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$(git rev-parse HEAD)" origin/main \
            || { echo "::error::Release tags must point to a commit on main"; exit 1; }

      - name: Resolve the release tag to one immutable revision
        id: resolve
        shell: bash
        env:
          RAW_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          raw="$RAW_TAG"
          case "$raw" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "::error::Release tags must be vMAJOR.MINOR.PATCH"; exit 1 ;;
          esac
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "tag=v${raw#v}" >> "$GITHUB_OUTPUT"
          echo "version=${raw#v}" >> "$GITHUB_OUTPUT"
          node scripts/verify_versions.mjs "${raw#v}" \
            || { echo "::error::The manifests at $raw do not identify as ${raw#v}; refusing to publish mismatched source"; exit 1; }

  rust-audit:
    needs: resolve
    runs-on: [self-hosted, Windows, X64, localmotive-release]
    permissions:
      contents: read
      checks: write
    steps:
      - name: Pin LF line endings before checkout
        shell: bash
        run: git config --global core.autocrlf false
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ needs.resolve.outputs.sha }}
      # The self-hosted runner keeps no cargo on PATH for fresh shells, and
      # audit-check shells out to cargo. Install the pinned toolchain first.
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable reviewed 2026-09-05
        with:
          components: clippy, rustfmt
      - name: Rust dependency advisory audit
        uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          working-directory: src-tauri

  verify:
    needs: [resolve, rust-audit]
    runs-on: [self-hosted, Windows, X64, localmotive-release]
    permissions:
      contents: read
    timeout-minutes: 360
    env:
      VERSION: ${{ needs.resolve.outputs.version }}
      RESOLVED_SHA: ${{ needs.resolve.outputs.sha }}
      LOCALMOTIVE_SOURCE_REVISION: ${{ needs.resolve.outputs.sha }}
      # P0-5 (REL-05) + P0-7 (D2): candidate and diagnostics files stage
      # here, under $RUNNER_TEMP — never in the checkout's tracked
      # artifacts/ directory. The stage mirrors the qualified-bundle
      # layout (artifacts/, sbom.cdx.json, release-evidence/), so the
      # uploaded bundle keeps the exact shape promotion publishes.
      # P0-10: the runner context is not allowed in job-level env, so the
      # setter step below exports STAGE_DIR through GITHUB_ENV instead.
    steps:
      # The self-hosted runner image defaults core.autocrlf=true; pin LF
      # before checkout (v5.1.0 has no git-config input).
      - name: Pin LF line endings before checkout
        shell: bash
        run: git config --global core.autocrlf false
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          fetch-depth: 0

      - name: Confirm the checked-out revision is the resolved release source
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$RESOLVED_SHA" \
            || { echo "::error::verify checkout does not match the resolved release revision"; exit 1; }

      - name: Set the out-of-checkout stage directory
        # P0-10: job-level env cannot use the runner context, so STAGE_DIR
        # enters through GITHUB_ENV. Forward slashes work in bash, pwsh,
        # node, and the upload-artifact path alike.
        shell: bash
        run: |
          STAGE_DIR="${RUNNER_TEMP//\\//}/localmotive-release"
          echo "STAGE_DIR=${STAGE_DIR}" >> "$GITHUB_ENV"
          mkdir -p "${STAGE_DIR}/artifacts"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable reviewed 2026-09-05
        with:
          components: clippy, rustfmt

      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2 peeled commit
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Verify manifest and lockfile versions
        run: node scripts/verify_versions.mjs ${{ needs.resolve.outputs.version }}

      - name: Verify immutable workflow action references
        run: node scripts/verify_workflow_pins.mjs

      - name: Verify fail-fast workflow gates
        run: node scripts/verify_workflow_gates.mjs

      - name: Frontend checks
        run: npm run check

      - name: Frontend dependency audit
        run: npm audit --audit-level=moderate

      - name: Rust formatting
        working-directory: src-tauri
        run: cargo fmt --check

      - name: Rust linting
        working-directory: src-tauri
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Rust tests
        working-directory: src-tauri
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo test --locked

      - name: Generate an SBOM for the shipped frontend dependencies
        shell: bash
        run: |
          npm sbom --sbom-format cyclonedx > sbom.cdx.json
          test -s sbom.cdx.json

      - name: Build installers and portable executable
        run: npm run tauri build

      - name: Stage release artifacts
        shell: bash
        run: |
          mkdir -p "$STAGE_DIR/artifacts"
          cp "src-tauri/target/release/bundle/msi/Localmotive_${VERSION}_x64_en-US.msi" "$STAGE_DIR/artifacts/Localmotive_${VERSION}_x64.msi"
          cp "src-tauri/target/release/bundle/nsis/Localmotive_${VERSION}_x64-setup.exe" "$STAGE_DIR/artifacts/Localmotive_${VERSION}_x64-setup.exe"
          cp "src-tauri/target/release/localmotive.exe" "$STAGE_DIR/artifacts/Localmotive_${VERSION}_x64-portable.exe"
          test -s "$STAGE_DIR/artifacts/Localmotive_${VERSION}_x64.msi"
          test -s "$STAGE_DIR/artifacts/Localmotive_${VERSION}_x64-setup.exe"
          test -s "$STAGE_DIR/artifacts/Localmotive_${VERSION}_x64-portable.exe"
          (cd "$STAGE_DIR/artifacts" && sha256sum Localmotive_* > "SHA256SUMS-${VERSION}.txt")
          test "$(wc -l < "$STAGE_DIR/artifacts/SHA256SUMS-${VERSION}.txt")" -eq 3
      - name: Verify the packaged executable
        shell: pwsh
        run: |
          $portable = "$env:STAGE_DIR/artifacts/Localmotive_$env:VERSION`_x64-portable.exe"
          if (-not (Test-Path $portable)) { throw "Staged portable was not produced by the stage step" }
          $cdpPort = 10041 + ([int]($env:GITHUB_RUN_ID % 2000))
          pwsh -NoProfile -File scripts/verify_packaged_matrix.ps1 -Portable $portable -Version "$env:VERSION" -ResolvedSha "$env:RESOLVED_SHA" -CdpPort $cdpPort
          if ($LASTEXITCODE -ne 0) { throw "Packaged verification orchestration failed with code $LASTEXITCODE" }

      - name: Collect packaged verification evidence into the stage
        # P0-5 (REL-05): the matrix writes its JSON records to the
        # workspace for local runs. The release keeps only copies of the
        # current run's records in the stage's artifacts/ directory, so
        # uploads never sweep up tracked or leftover files. Runs on failure
        # too, so a failed verification still retains its partial evidence.
        if: success() || failure()
        shell: bash
        run: |
          mkdir -p "$STAGE_DIR/artifacts"
          for record in "packaged-verification-${VERSION}.json" "packaged-verification-catalog-${VERSION}.json" "catalog-matrix-first-fill.json" "catalog-matrix-restart.json" "catalog-fixture-init.json"; do
            if test -f "artifacts/$record"; then cp "artifacts/$record" "$STAGE_DIR/artifacts/$record"; fi
          done


      - name: Verify and record the exact candidate inventory
        shell: bash
        run: node scripts/verify_candidate_inventory.mjs "$STAGE_DIR/artifacts" "$VERSION" "$STAGE_DIR/artifacts/candidate-inventory-${VERSION}.json"

      - name: Clear candidate-generated attestations
        shell: bash
        run: |
          mkdir -p "release-evidence/${VERSION}/attestations"
          rm -f "release-evidence/${VERSION}/attestations/installer-payload-identity.json"
          rm -f "release-evidence/${VERSION}/attestations"/sandbox-clean-account-lifecycle-*

      - name: Measure the staged installer payload identities
        shell: bash
        run: node scripts/verify_installer_payloads.mjs "$STAGE_DIR/artifacts" "$STAGE_DIR/artifacts/candidate-inventory-${VERSION}.json" "release-evidence/${VERSION}/attestations/installer-payload-identity.json"

      - name: Ensure Windows Sandbox is available
        shell: pwsh
        timeout-minutes: 5
        run: |
          $exe = Join-Path $env:WINDIR "System32\WindowsSandbox.exe"
          if (-not (Test-Path $exe)) {
            throw "Windows Sandbox is not available on this PC. Enable it (Windows Features) then re-run."
          }
          Write-Host "Found $exe"
          $cli = Get-Command wsb.exe -ErrorAction Stop
          $cliVersion = & $cli.Source --version
          if ($LASTEXITCODE -ne 0 -or -not $cliVersion) { throw "Windows Sandbox CLI could not report its version. Repair wsb.exe before lifecycle verification." }
          Write-Host "Windows Sandbox CLI: $($cli.Source), version $cliVersion"

      - name: Run the clean-account lifecycle leg from the candidate bytes
        # P0-7 (D2): the gate keeps one lifecycle leg — clean install,
        # upgrade from the last published version with user-data
        # preservation, and uninstall.
        shell: pwsh
        timeout-minutes: 120
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $leg = @{ Name = "sandbox-clean-account-lifecycle-preservation-v0.5.0"; Previous = "v0.5.0"; Flavor = "mirror" }
          Write-Host "=== $($leg.Name): baseline $($leg.Previous), persistence $($leg.Flavor) ==="
          & ".\scripts\sandbox\host-run-lifecycle.ps1" -Tag "${{ needs.resolve.outputs.tag }}" -Version "$env:VERSION" -PreviousTag $leg.Previous -CandidateDir "$env:STAGE_DIR/artifacts" -EvidenceName $leg.Name -PreservationFlavor $leg.Flavor

      - name: Mirror attestations and the SBOM into the stage
        # P0-7 (D2): the stage mirrors the qualified-bundle layout, so the
        # manifest binds stage-relative record paths and the uploaded bundle
        # keeps the exact shape promotion publishes. Producers still write
        # to the workspace; only current-run files are mirrored.
        shell: bash
        run: |
          mkdir -p "$STAGE_DIR/release-evidence/${VERSION}/attestations"
          cp release-evidence/${VERSION}/attestations/* "$STAGE_DIR/release-evidence/${VERSION}/attestations/"
          cp sbom.cdx.json "$STAGE_DIR/sbom.cdx.json"

      - name: Assemble the canonical qualification manifest
        shell: bash
        run: node scripts/build_qualification_manifest.mjs --inventory "$STAGE_DIR/artifacts/candidate-inventory-${VERSION}.json" --attestations "$STAGE_DIR/release-evidence/${VERSION}/attestations" --release "$VERSION" --stage-packaged-verification "$STAGE_DIR/artifacts/packaged-verification-${VERSION}.json" --record-root "$STAGE_DIR" --out "$STAGE_DIR/release-evidence/${VERSION}/qualification-manifest-${VERSION}.json"

      - name: Validate the promotion contract without publishing
        shell: bash
        run: node scripts/verify_release_promotion.mjs --qualified "$STAGE_DIR" --tag "v${VERSION}" --expect-source "$RESOLVED_SHA" --report "$STAGE_DIR/artifacts/promotion-check-${VERSION}.json"

      - name: Retain the qualified candidate bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: localmotive-${{ needs.resolve.outputs.version }}-qualified
          path: ${{ env.STAGE_DIR }}/**
          if-no-files-found: error
          retention-days: 90

      - name: Retain diagnostics after failure or cancellation
        if: failure() || cancelled()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: localmotive-${{ needs.resolve.outputs.version }}-verify-diagnostics
          path: |
            ${{ env.STAGE_DIR }}/**
            sbom.cdx.json
            src-tauri/target/release/bundle/**
            release-evidence/${{ needs.resolve.outputs.version }}/attestations/*
          if-no-files-found: warn
          retention-days: 90

      - name: Report missing packaged evidence
        if: failure()
        shell: pwsh
        run: pwsh -NoProfile -File scripts/check_package_outputs.ps1 -Root "$env:STAGE_DIR/artifacts" -Version "$env:VERSION"
