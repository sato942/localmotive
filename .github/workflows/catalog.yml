name: Publish curated catalog

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Resolve, sign, and validate the curated catalog
        env:
          GGUF_PILOT_CATALOG_SIGNING_KEY_PEM: ${{ secrets.CATALOG_SIGNING_KEY_PEM }}
        run: |
          test -n "$GGUF_PILOT_CATALOG_SIGNING_KEY_PEM" \
            || { echo "::error::CATALOG_SIGNING_KEY_PEM is not configured"; exit 1; }
          npm run catalog:refresh
          npm run catalog:validate

      - name: Publish the signed manifest
        shell: bash
        run: |
          if git diff --quiet -- catalog/catalog.json catalog/catalog.json.sig; then
            echo "Catalog metadata is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog/catalog.json catalog/catalog.json.sig
          git commit -m "chore(catalog): refresh curated manifest"
          git push origin HEAD:main
