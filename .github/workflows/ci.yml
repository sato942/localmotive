name: CI

# Every push and PR to main: logic, schema, dependency, documentation and
# packaged-binary smoke gates run before a commit can become a release tag.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable reviewed 2026-09-05
        with:
          components: clippy, rustfmt

      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2 peeled commit
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Verify manifest and lockfile versions
        run: node scripts/verify_versions.mjs 0.4.1

      - name: Verify immutable workflow action references
        run: node scripts/verify_workflow_pins.mjs

      - name: Verify fail-fast workflow gates
        run: node scripts/verify_workflow_gates.mjs

      - name: Test deterministic release gates
        run: node --test scripts/tests/release-gates.test.mjs

      - name: Frontend checks
        run: npm run check

      - name: Frontend dependency audit
        run: npm audit --audit-level=moderate

      - name: Rust formatting
        working-directory: src-tauri
        run: cargo fmt --check

      - name: Rust linting
        working-directory: src-tauri
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Rust tests
        working-directory: src-tauri
        run: cargo test --locked

      - name: Rust documentation tests
        working-directory: src-tauri
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo test --locked --doc


  rust-audit:
    runs-on: windows-latest
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Rust dependency advisory audit
        uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          working-directory: src-tauri

  package-smoke:
    needs: [check, rust-audit]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable reviewed 2026-09-05
      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2 peeled commit
        with:
          workspaces: src-tauri
      - run: npm ci
      - name: Build the installable application
        run: npm run tauri build
      - name: Verify all Windows artifacts and launch the portable build
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $portable = "src-tauri/target/release/localmotive.exe"
          $msi = "src-tauri/target/release/bundle/msi/Localmotive_${version}_x64_en-US.msi"
          $setup = "src-tauri/target/release/bundle/nsis/Localmotive_${version}_x64-setup.exe"
          foreach ($path in @($portable, $msi, $setup)) {
            if (-not (Test-Path $path)) { throw "Missing packaged artifact: $path" }
            if ((Get-Item $path).Length -le 0) { throw "Empty packaged artifact: $path" }
          }
          $process = Start-Process $portable -PassThru
          Start-Sleep -Seconds 8
          if ($process.HasExited) { throw "Packaged app exited during startup with code $($process.ExitCode)" }
          Stop-Process -Id $process.Id -Force
