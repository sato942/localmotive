name: CI

# Trusted main pushes run on the always-on self-hosted runner, sharing the
# machine with Hardware qualify. Pull requests NEVER run on the self-hosted
# runner: untrusted fork code executes only in the ephemeral GitHub-hosted
# `pr-check` job, which requests no secrets and only read permissions
# (audit GH-01). The push jobs stay the validation gate for main; the PR job
# exists so required checks can actually execute for an ordinary pull
# request. Merging is additionally gated by the repository's main-branch
# ruleset (see AGENTS.md "CI and publication").
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # Trusted main pushes only: a pull request must never reach this runner.
    if: github.event_name == 'push'
    runs-on: [self-hosted, Windows, X64, zen5, blackwell, localmotive-hw]
    steps:
      # The research anchor verifier shells out to `git ls-files
      # --error-unmatch`, so a single-commit shallow checkout cannot prove
      # tracking. Fetch full history plus tags on this trusted runner.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable reviewed 2026-09-05
        with:
          components: clippy, rustfmt

      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2 peeled commit
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Verify manifest and lockfile versions
        run: node scripts/verify_versions.mjs

      - name: Verify immutable workflow action references
        run: node scripts/verify_workflow_pins.mjs

      - name: Verify fail-fast workflow gates
        run: node scripts/verify_workflow_gates.mjs

      # U06-01: the packaged-orchestration acceptance matrix drives the REAL
      # Invoke-PackagedMatrix decision path under pwsh (same shell as the
      # release workflow). It must run in CI so a cleanup regression fails
      # the gate instead of reaching the release workflow.
      - name: Test packaged-orchestration cleanup matrix (pwsh)
        shell: pwsh
        run: pwsh -NoProfile -File scripts/tests/verify_cleanup_matrix.ps1

      - name: Frontend checks
        run: npm run check

      - name: Frontend dependency audit
        run: npm audit --audit-level=moderate

      - name: Rust formatting
        working-directory: src-tauri
        run: cargo fmt --check

      - name: Rust linting
        working-directory: src-tauri
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Rust tests
        working-directory: src-tauri
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo test --locked


  rust-audit:
    if: github.event_name == 'push'
    runs-on: [self-hosted, Windows, X64, zen5, blackwell, localmotive-hw]
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      # The self-hosted runner keeps no cargo on PATH for fresh shells, and
      # audit-check shells out to cargo. Install the pinned toolchain first.
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable reviewed 2026-09-05
        with:
          components: clippy, rustfmt
      - name: Rust dependency advisory audit
        uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          working-directory: src-tauri

  package-smoke:
    if: github.event_name == 'push'
    needs: [check, rust-audit]
    runs-on: [self-hosted, Windows, X64, zen5, blackwell, localmotive-hw]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable reviewed 2026-09-05
      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2 peeled commit
        with:
          workspaces: src-tauri
      - run: npm ci
      - name: Build the installable application
        run: npm run tauri build
      - name: Verify all Windows artifacts and launch the portable build
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $portable = "src-tauri/target/release/localmotive.exe"
          $msi = "src-tauri/target/release/bundle/msi/Localmotive_${version}_x64_en-US.msi"
          $setup = "src-tauri/target/release/bundle/nsis/Localmotive_${version}_x64-setup.exe"
          foreach ($path in @($portable, $msi, $setup)) {
            if (-not (Test-Path $path)) { throw "Missing packaged artifact: $path" }
            if ((Get-Item $path).Length -le 0) { throw "Empty packaged artifact: $path" }
          }
          $process = Start-Process $portable -PassThru
          Start-Sleep -Seconds 8
          if ($process.HasExited) { throw "Packaged app exited during startup with code $($process.ExitCode)" }
          & taskkill /PID $process.Id /T /F | Out-Null
          if ($LASTEXITCODE -ne 0 -and $LASTEXITCODE -ne 128) { throw "Packaged app tree stop failed with code $LASTEXITCODE" }

  # Required pull-request checks: stable name, ephemeral isolated host, no
  # secrets, read-only permissions. This is the only job a pull request may
  # execute (audit GH-01).
  pr-check:
    if: github.event_name == 'pull_request'
    runs-on: windows-latest
    # PR #18 follow-up (run 34786186394): the hosted pr-check hung 2h+ on the
    # bare `cargo test --locked` step (GPU-less windows-latest, no skip, no
    # timeout). This hosted-only job must fail fast: a job ceiling plus step
    # ceilings plus LOCALMOTIVE_SKIP_HARDWARE_PROBE on the Rust steps, with
    # --nocapture so the next hang shows the last test name. GH-01 unchanged:
    # PRs still run only this job on windows-latest; the push jobs that run
    # on the local hardware fleet keep real hardware probing (no skip there).
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable reviewed 2026-09-05
        with:
          components: clippy, rustfmt

      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2 peeled commit
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Verify manifest and lockfile versions
        run: node scripts/verify_versions.mjs

      - name: Verify immutable workflow action references
        run: node scripts/verify_workflow_pins.mjs

      - name: Verify fail-fast workflow gates
        run: node scripts/verify_workflow_gates.mjs

      # U06-01: the packaged-orchestration acceptance matrix drives the REAL
      # Invoke-PackagedMatrix decision path under pwsh (same shell as the
      # release workflow). It must run in CI so a cleanup regression fails
      # the gate instead of reaching the release workflow.
      - name: Test packaged-orchestration cleanup matrix (pwsh)
        shell: pwsh
        run: pwsh -NoProfile -File scripts/tests/verify_cleanup_matrix.ps1

      - name: Frontend checks
        run: npm run check

      - name: Frontend dependency audit
        run: npm audit --audit-level=moderate

      - name: Rust formatting
        working-directory: src-tauri
        run: cargo fmt --check

      - name: Rust linting
        working-directory: src-tauri
        timeout-minutes: 20
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Rust tests
        working-directory: src-tauri
        timeout-minutes: 30
        env:
          LOCALMOTIVE_SKIP_HARDWARE_PROBE: "1"
          CARGO_TERM_COLOR: always
          RUST_BACKTRACE: "1"
          RUSTDOCFLAGS: -D warnings
        run: cargo test --locked -- --nocapture
