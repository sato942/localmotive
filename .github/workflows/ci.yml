name: CI

# Every push and PR to main: the same checks the release workflow runs, minus
# the packaging step, so a broken commit is caught before it is ever tagged.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Frontend checks
        run: |
          npx tsc --noEmit -p tsconfig.json
          npm test
          npm run build

      - name: Rust checks
        working-directory: src-tauri
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo test
