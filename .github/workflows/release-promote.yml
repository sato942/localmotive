name: Release promote

# Publication is a separate, explicitly authorized act (R16 release behavior).
# Tag pushes run `.github/workflows/release.yml`, which verifies and qualifies
# but never publishes. This workflow consumes the exact qualified bundle that
# verify run uploaded - it never rebuilds, never rewrites checksums - and it
# refuses to run unless every gate below passes:
#
#   1. the dispatcher is the repository owner,
#   2. the confirm phrase matches `PUBLISH <tag>` exactly,
#   3. the named verify run completed successfully for the same commit the tag
#      still points at today,
#   4. that commit is on main and its required checks concluded successfully,
#   5. the qualified bundle's manifest, inventory, artifacts, checksums and
#      mandatory records all agree (scripts/verify_release_promotion.mjs),
#   6. dry_run is false.
#
# A dry run (the default) executes every validation step and publishes nothing.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to promote (e.g. v0.6.0)"
        required: true
      verify_run_id:
        description: "Run id of the successful Release verify run that produced the qualified bundle"
        required: true
      confirm:
        description: "Type PUBLISH <tag> to authorize publication (required even for a dry run)"
        required: true
      dry_run:
        description: "Validate without publishing"
        required: true
        type: boolean
        default: true

permissions:
  contents: read

# A later tag push must never cancel an in-flight promotion, and two
# promotions must never share the runner CDP state.
concurrency:
  group: localmotive-release-promote
  cancel-in-progress: false

jobs:
  gate:
    # Only the repository owner may start the publication path at all.
    if: github.actor == github.repository_owner
    runs-on: [self-hosted, Windows, X64, zen5, blackwell, localmotive-hw]
    permissions:
      contents: read
      actions: read
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
      version: ${{ steps.resolve.outputs.version }}
    steps:
      # The self-hosted runner image defaults core.autocrlf=true; pin LF
      # before checkout (v5.1.0 has no git-config input).
      - name: Pin LF line endings before checkout
        shell: bash
        run: git config --global core.autocrlf false
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
          fetch-tags: true

      - name: Resolve the tag, require the confirm phrase, and bind the verify run
        id: resolve
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          VERIFY_RUN_ID: ${{ inputs.verify_run_id }}
          CONFIRM: ${{ inputs.confirm }}
          REPO: ${{ github.repository }}
        run: |
          case "$TAG" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "::error::Promotion tags must be vMAJOR.MINOR.PATCH"; exit 1 ;;
          esac
          test "$CONFIRM" = "PUBLISH $TAG" \
            || { echo "::error::The confirm phrase must be exactly 'PUBLISH $TAG'"; exit 1; }
          case "$VERIFY_RUN_ID" in
            ''|*[!0-9]*) echo "::error::verify_run_id must be the numeric GitHub Actions run id"; exit 1 ;;
          esac

          sha="$(git rev-parse HEAD)"
          git fetch --tags --force origin "+refs/tags/${TAG}:refs/tags/${TAG}" >/dev/null 2>&1
          peeled="$(git rev-parse "refs/tags/${TAG}^{commit}" 2>/dev/null)" \
            || { echo "::error::tag ${TAG} is not visible on the remote"; exit 1; }
          test "$sha" = "$peeled" \
            || { echo "::error::tag ${TAG} resolves to ${peeled}, not the checked-out ${sha}"; exit 1; }
          git fetch origin main >/dev/null 2>&1
          git merge-base --is-ancestor "$sha" origin/main \
            || { echo "::error::Promotion source ${sha} is not on main"; exit 1; }

          gh api "repos/${REPO}/actions/runs/${VERIFY_RUN_ID}" > verify-run.json
          EXPECTED_SHA="$sha" node -e "
            const run = JSON.parse(require('fs').readFileSync('verify-run.json','utf8'));
            const assert = require('assert');
            assert.equal(run.name, 'Release verify', 'verify run name');
            assert.equal(run.event, 'push', 'verify run event');
            assert.equal(run.conclusion, 'success', 'verify run conclusion');
            assert.equal(run.head_sha, process.env.EXPECTED_SHA, 'verify run head sha');
          " EXPECTED_SHA="$sha" \
            || { echo "::error::run ${VERIFY_RUN_ID} is not a successful Release verify run for ${TAG} at ${sha}"; exit 1; }

          # Required governance: the commit's required checks concluded green.
          gh api "repos/${REPO}/commits/${sha}/check-runs?per_page=100" > check-runs.json
          EXPECTED_SHA="$sha" node -e "
            const runs = JSON.parse(require('fs').readFileSync('check-runs.json','utf8')).check_runs ?? [];
            const required = ['pr-check', 'check'];
            const green = required.filter((name) => runs.some((run) => run.name === name && run.conclusion === 'success'));
            if (green.length === 0) {
              console.error('::error::no required check (pr-check or check) is green for ' + process.env.EXPECTED_SHA);
              process.exit(1);
            }
            console.log('required checks green: ' + green.join(', '));
          " EXPECTED_SHA="$sha" \
            || { echo "::error::required checks did not conclude successfully for ${sha}"; exit 1; }

          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "Promoting ${TAG} at ${sha} from verify run ${VERIFY_RUN_ID}."

      - name: Download the qualified bundle produced by that verify run
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: localmotive-${{ steps.resolve.outputs.version }}-qualified
          path: qualified
          run-id: ${{ inputs.verify_run_id }}
          github-token: ${{ github.token }}

      - name: Overlay the qualified bundle onto the checked-out revision
        shell: bash
        run: |
          test -d qualified/artifacts || { echo "::error::the qualified bundle carries no artifacts directory"; exit 1; }
          mkdir -p artifacts "release-evidence/${{ steps.resolve.outputs.version }}/attestations"
          cp -r qualified/artifacts/. artifacts/
          cp -r "qualified/release-evidence/${{ steps.resolve.outputs.version }}/." "release-evidence/${{ steps.resolve.outputs.version }}/"
          test -f "release-evidence/${{ steps.resolve.outputs.version }}/qualification-manifest-${{ steps.resolve.outputs.version }}.json" \
            || { echo "::error::the qualified bundle carries no qualification manifest"; exit 1; }

      - name: Validate the qualified set against every identity relationship
        shell: bash
        env:
          VERSION: ${{ steps.resolve.outputs.version }}
          RESOLVED_SHA: ${{ steps.resolve.outputs.sha }}
          VERIFY_RUN_ID: ${{ inputs.verify_run_id }}
        run: |
          node scripts/verify_qualification_manifest.mjs --expect-source "$RESOLVED_SHA"
          node scripts/verify_release_promotion.mjs --qualified . --tag "v${VERSION}" --expect-source "$RESOLVED_SHA" --verify-run "$VERIFY_RUN_ID" --report "artifacts/promotion-check-${VERSION}.json"
          (cd artifacts && sha256sum -c "SHA256SUMS-${VERSION}.txt")
          echo "Honestly unsigned full release: Authenticode is DEFERRED_BY_OWNER; no signature is claimed. SmartScreen may warn."

      - name: Retain the promotion decision record
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: promotion-decision-${{ inputs.tag }}-${{ inputs.verify_run_id }}
          path: |
            artifacts/promotion-check-${{ steps.resolve.outputs.version }}.json
            verify-run.json
            check-runs.json
          if-no-files-found: ignore
          retention-days: 90

  publish:
    needs: gate
    # A dry run validates and stops; publication needs dry_run=false.
    if: inputs.dry_run == false
    runs-on: [self-hosted, Windows, X64, zen5, blackwell, localmotive-hw]
    permissions:
      contents: write
      actions: read
    steps:
      - name: Pin LF line endings before checkout
        shell: bash
        run: git config --global core.autocrlf false
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ inputs.tag }}

      - name: Re-resolve the remote tag immediately before publication (drift gate)
        shell: bash
        env:
          TAG: ${{ inputs.tag }}
          RESOLVED_SHA: ${{ needs.gate.outputs.sha }}
        run: |
          peeled=$(git ls-remote origin "refs/tags/${TAG}^{}" | awk '{print $1}')
          if [ -z "$peeled" ]; then
            peeled=$(git ls-remote origin "refs/tags/${TAG}" | awk '{print $1}')
          fi
          test -n "$peeled" || { echo "::error::tag ${TAG} is not visible on the remote"; exit 1; }
          test "$peeled" = "$RESOLVED_SHA" \
            || { echo "::error::tag ${TAG} now points at $peeled, expected $RESOLVED_SHA; refusing to publish drifted source"; exit 1; }
          echo "Tag ${TAG} still points at the resolved revision $RESOLVED_SHA."

      - name: Download the exact qualified bundle again
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: localmotive-${{ needs.gate.outputs.version }}-qualified
          path: qualified
          run-id: ${{ inputs.verify_run_id }}
          github-token: ${{ github.token }}

      - name: Overlay the qualified bundle onto the checked-out revision
        shell: bash
        run: |
          mkdir -p artifacts "release-evidence/${{ needs.gate.outputs.version }}/attestations"
          cp -r qualified/artifacts/. artifacts/
          cp -r "qualified/release-evidence/${{ needs.gate.outputs.version }}/." "release-evidence/${{ needs.gate.outputs.version }}/"

      - name: Re-validate the exact bytes that are about to be published
        shell: bash
        env:
          VERSION: ${{ needs.gate.outputs.version }}
          RESOLVED_SHA: ${{ needs.gate.outputs.sha }}
          VERIFY_RUN_ID: ${{ inputs.verify_run_id }}
        run: |
          node scripts/verify_qualification_manifest.mjs --expect-source "$RESOLVED_SHA"
          node scripts/verify_release_promotion.mjs --qualified . --tag "v${VERSION}" --expect-source "$RESOLVED_SHA" --verify-run "$VERIFY_RUN_ID" --report "artifacts/promotion-check-${VERSION}.json"
          (cd artifacts && sha256sum -c "SHA256SUMS-${VERSION}.txt")

      - name: Extract this version's changelog section
        shell: bash
        env:
          VERSION: ${{ needs.gate.outputs.version }}
        run: |
          section=$(awk -v v="## ${VERSION}" '$0 == v {found=1; next} found && /^## / {exit} found {print}' CHANGELOG.md)
          test -n "$(printf '%s' "$section" | tr -d '[:space:]')"
          {
            echo "## Localmotive ${VERSION}"
            echo
            printf '%s\n' "$section"
            echo
            echo "### Downloads"
            echo
            echo "| File | Use |"
            echo "|---|---|"
            echo "| \`Localmotive_${VERSION}_x64-setup.exe\` | Recommended installer (NSIS) |"
            echo "| \`Localmotive_${VERSION}_x64.msi\` | MSI installer for managed deployment |"
            echo "| \`Localmotive_${VERSION}_x64-portable.exe\` | Portable executable, no installation |"
            echo "| \`SHA256SUMS-${VERSION}.txt\` | Executable and installer SHA-256 inventory |"
            echo "| \`packaged-verification-${VERSION}.json\` | Packaged behavior evidence |"
            echo "| \`candidate-inventory-${VERSION}.json\` | Candidate size and digest evidence |"
            echo
            echo "Target scope: Windows 10 and Windows 11 x64. See the qualification limitations above."
            echo ""
            echo "This full release is honestly unsigned: Authenticode is DEFERRED_BY_OWNER, no signature is claimed, and Windows SmartScreen may warn. Verify the published SHA-256 checksums before use."
          } > release-notes.md

      - name: Publish the explicitly authorized honestly unsigned full release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ inputs.tag }}
          name: Localmotive ${{ needs.gate.outputs.version }} (unsigned)
          prerelease: false
          body_path: release-notes.md
          files: |
            artifacts/Localmotive_${{ needs.gate.outputs.version }}_x64-setup.exe
            artifacts/Localmotive_${{ needs.gate.outputs.version }}_x64-portable.exe
            artifacts/Localmotive_${{ needs.gate.outputs.version }}_x64.msi
            artifacts/SHA256SUMS-${{ needs.gate.outputs.version }}.txt
            artifacts/packaged-verification-${{ needs.gate.outputs.version }}.json
            artifacts/candidate-inventory-${{ needs.gate.outputs.version }}.json
          fail_on_unmatched_files: true

      - name: Read back and verify the public release against the producer record
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          VERSION: ${{ needs.gate.outputs.version }}
          RESOLVED_SHA: ${{ needs.gate.outputs.sha }}
        run: |
          rm -rf public-readback
          mkdir public-readback
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" \
            --json tagName,name,isDraft,isPrerelease,assets,body \
            > public-readback/release.json
          node -e "const r=JSON.parse(require('fs').readFileSync('public-readback/release.json','utf8')); const assert=require('assert'); assert.equal(r.tagName,process.env.TAG); assert.equal(r.name,'Localmotive '+process.env.VERSION+' (unsigned)'); assert.equal(r.isDraft,false); assert.equal(r.isPrerelease,false); assert.equal(r.assets.length,6);"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
            --dir public-readback --clobber
          for name in \
            "Localmotive_${VERSION}_x64-setup.exe" \
            "Localmotive_${VERSION}_x64-portable.exe" \
            "Localmotive_${VERSION}_x64.msi" \
            "SHA256SUMS-${VERSION}.txt" \
            "packaged-verification-${VERSION}.json" \
            "candidate-inventory-${VERSION}.json"; do
            test -s "public-readback/$name"
          done
          cmp "artifacts/SHA256SUMS-${VERSION}.txt" "public-readback/SHA256SUMS-${VERSION}.txt"
          cmp "artifacts/candidate-inventory-${VERSION}.json" "public-readback/candidate-inventory-${VERSION}.json"
          cmp "artifacts/packaged-verification-${VERSION}.json" "public-readback/packaged-verification-${VERSION}.json"
          # The published inventory must verify against the published artifact
          # set, and the published packaged-verification record must be the
          # producer record the qualification manifest references.
          LOCALMOTIVE_SOURCE_REVISION="$RESOLVED_SHA" node scripts/verify_candidate_inventory.mjs --verify "public-readback/candidate-inventory-${VERSION}.json" "$VERSION"
          (cd public-readback && sha256sum -c "SHA256SUMS-${VERSION}.txt")

      - name: Retain public release read-back evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: localmotive-${{ needs.gate.outputs.version }}-public-readback
          path: public-readback/*
          if-no-files-found: error
          retention-days: 90

      - name: Retain publish diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: localmotive-${{ needs.gate.outputs.version }}-publish-diagnostics
          path: |
            public-readback/
            release-notes.md
            artifacts/promotion-check-${{ needs.gate.outputs.version }}.json
          if-no-files-found: ignore
          retention-days: 30
