name: Bug report
description: Something in Localmotive behaves incorrectly
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Do not include credentials, tokens, or private file paths. For
        security issues use the process in SECURITY.md instead.
  - type: input
    id: version
    attributes:
      label: Version
      description: From About, or package.json
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How did you install it
      options: [MSI installer, NSIS installer, Portable exe, Built from source]
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Include the smallest sequence that shows the problem.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect, and what happened instead
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Logs or screenshots
      description: Bounded excerpts only. The server log path is shown on the Control screen.
    validations:
      required: false
