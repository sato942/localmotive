name: Feature request
description: Suggest a change to Localmotive
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Localmotive is a control plane for llama.cpp, not an inference engine.
        Requests that would reimplement llama.cpp belong upstream.
  - type: textarea
    id: need
    attributes:
      label: The need
      description: What are you trying to do that the app makes hard today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like to see
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
    validations:
      required: false
