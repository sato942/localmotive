[package]
rust-version = "1.98"
name = "localmotive"
version = "0.6.0"
description = "A public Windows desktop control plane for local GGUF inference"
authors = ["Localmotive contributors"]
edition = "2021"
license = "MIT"
repository = "https://github.com/sato942/localmotive"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "localmotive_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls", "gzip", "brotli", "deflate", "zstd"] }
zip = { version = "4", default-features = false, features = ["deflate"] }
sha2 = "0.10"
hex = "0.4"
tauri-plugin-dialog = "2"
keyring = { version = "3", features = ["windows-native"] }
base64 = "0.22"
rand = "0.8"
cap-std = "4.0.3"
ed25519-dalek = { version = "2.2", features = ["std"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_NetworkManagement_IpHelper", "Win32_Networking_WinSock", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_JobObjects", "Win32_System_ProcessStatus", "Win32_System_SystemInformation", "Win32_System_Threading"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "=0.62.2", features = ["Win32_Foundation", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_System_Threading"] }
windows-version = "=0.1.7"
process-wrap = { version = "=10.0.0", default-features = false, features = ["std", "job-object", "creation-flags"] }

[dev-dependencies]
# Test-only TLS fixture server for the centralized local client (audit
# MT-06); the same rustls version reqwest already links.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "logging", "tls12"] }
