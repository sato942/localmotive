[package]
name = "gguf-pilot"
version = "0.2.4"
description = "A public Windows desktop control plane for local GGUF inference"
authors = ["GGUF Pilot contributors"]
edition = "2021"
license = "MIT"
repository = "https://github.com/sato942/gguf-pilot"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "gguf_pilot_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls", "gzip", "brotli", "deflate", "zstd"] }
zip = { version = "4", default-features = false, features = ["deflate"] }
sha2 = "0.10"
hex = "0.4"
tauri-plugin-dialog = "2"
keyring = { version = "3", features = ["windows-native"] }
base64 = "0.22"
rand = "0.8"

